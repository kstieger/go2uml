name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release binaries
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache-dependency-path: go.sum

    - name: Cross-compile binaries
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME}"
        BUILTAT="$(date -u '+%Y-%m-%d_%H:%M:%S')"
        GITHASH="$(git rev-parse HEAD)"
        LDFLAGS="-w -s -X main.Version=${VERSION} -X main.BuiltAt=${BUILTAT} -X main.GitHash=${GITHASH}"

        mkdir -p dist
        targets=("linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64")
        for target in "${targets[@]}"; do
          read -r os arch <<< "$target"
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          out="dist/go2uml-${os}-${arch}${ext}"
          echo "building ${os}/${arch}..."
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "$out" -ldflags "$LDFLAGS" ./cmd
        done

    - name: Publish GitHub Release with binaries
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" \
          --verify-tag \
          --generate-notes \
          --title "${GITHUB_REF_NAME}" \
          dist/*
