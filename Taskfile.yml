version: '3'

vars:
  BINARY_NAME: go2uml
  BINARY_PATH: bin/{{.BINARY_NAME}}
  GO_MAIN: ./cmd
  EXAMPLE_DIR: ./example
  DIST_DIR: dist
  REMOTE_NAME: origin
  TAG: '{{default "" .TAG}}'
  VERSION:
    sh: git describe --tags --always --dirty
  BUILTAT:
    sh: date -u '+%Y-%m-%d_%H:%M:%S'
  GITHASH:
    sh: git rev-parse HEAD
  LDFLAGS: -w -s -X main.Version={{.VERSION}} -X main.BuiltAt={{.BUILTAT}} -X main.GitHash={{.GITHASH}}

tasks:
  run:
    desc: Run go2uml against the example package in Mermaid mode
    cmds:
      - go run {{.GO_MAIN}} -format=mermaid {{.EXAMPLE_DIR}}

  build:
    desc: Cross-compile the go2uml binary for linux/darwin/windows (amd64+arm64)
    cmds:
      - |
        set -euo pipefail
        targets=("linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64")
        for target in "${targets[@]}"; do
          read -r os arch <<< "$target"
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          outdir="{{.DIST_DIR}}/${os}-${arch}"
          mkdir -p "$outdir"
          echo "building ${os}/${arch}..."
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o "${outdir}/{{.BINARY_NAME}}${ext}" -ldflags "{{.LDFLAGS}}" {{.GO_MAIN}}
        done

  format:
    desc: Format Go code and tidy modules
    cmds:
      - go fmt ./...
      - go mod tidy

  lint:
    desc: Run golangci-lint with the repo configuration
    cmds:
      - golangci-lint run ./...

  vulncheck:
    desc: Scan dependencies and code paths for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  test:
    desc: Run the full test suite
    cmds:
      - go test -v -race -coverprofile=coverage.out ./...

  pre-checkin:
    desc: Run formatting, linting, vulnerability scanning, and tests before committing
    cmds:
      - task: format
      - task: lint
      - task: vulncheck
      - task: test

  release:
    desc: Validate master, create or reuse a tag, and publish a GitHub Release
    deps:
      - pre-checkin
    cmds:
      - |
        current_branch=$(git branch --show-current)
        if [[ "$current_branch" != "master" ]]; then
          echo "release requires the current branch to be master" >&2
          exit 1
        fi

        if [[ -n "$(git status --porcelain)" ]]; then
          echo "release requires a clean working tree" >&2
          exit 1
        fi

        git remote get-url {{.REMOTE_NAME}} >/dev/null 2>&1
        git fetch {{.REMOTE_NAME}} --tags

        if ! command -v gh >/dev/null 2>&1; then
          echo "release requires GitHub CLI (gh) to create the GitHub Release" >&2
          exit 1
        fi

        requested_tag='{{.TAG}}'
        if [[ -n "$requested_tag" ]]; then
          next_tag="$requested_tag"
        else
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            next_tag=v0.1.0
          else
            version=${latest_tag#v}
            IFS=. read -r major minor patch _extra <<< "$version"
            if [[ -z "$major" || -z "$minor" ]]; then
              echo "latest tag '$latest_tag' is not a supported semantic version" >&2
              exit 1
            fi
            if [[ -z "$patch" ]]; then
              patch=0
            fi
            next_tag=v${major}.${minor}.$((patch + 1))
          fi
        fi

        if ! git rev-parse "$next_tag" >/dev/null 2>&1; then
          git tag -a "$next_tag" -m "Release $next_tag"
        fi

        if ! git ls-remote --tags {{.REMOTE_NAME}} "$next_tag" | grep -q "$next_tag"; then
          git push {{.REMOTE_NAME}} "$next_tag"
        fi

        if gh release view "$next_tag" >/dev/null 2>&1; then
          echo "GitHub Release already exists for $next_tag"
          exit 0
        fi

        gh release create "$next_tag" \
          --verify-tag \
          --generate-notes \
          --title "$next_tag"

        echo "created and published GitHub Release $next_tag"